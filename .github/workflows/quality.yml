name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/processors/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.3'
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: python -m venv .venv
      - name: Install pinned Lizard
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe -m pip install -r tools/quality/requirements.txt
          else
            .venv/bin/python -m pip install -r tools/quality/requirements.txt
          fi
      - run: npm run quality
      - run: npm test
      - name: Install pinned processor sources without native install scripts
        run: npm ci --prefix tools/processors --ignore-scripts
      - run: npm run test:processors
      - run: node --test tools/engine/suite-report-check.cjs
      - run: npm run check:bundle

